# Knowstead – Start mit Docker:  cp .env.example .env  &&  docker compose up -d
services:
  knowstead:
    build:
      context: .
      args:
        # Texterkennung für Scans mitinstallieren (Tesseract mit deutschen und englischen Sprachdaten)
        WITH_OCR: "${WITH_OCR:-false}"
    image: knowstead:latest
    container_name: knowstead
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Öffentliche Adresse (Links in E-Mails, Webhooks, API-Doku)
      BASE_URL: "${BASE_URL:-http://localhost:3000}"
      # Schlüssel für verschlüsselte Zugangsdaten – unbedingt selbst setzen!
      # (DOKU_SECRET: der Name aus der Zeit vor Version 2.0 – eine bestehende .env gilt weiter)
      KNOWSTEAD_SECRET: "${KNOWSTEAD_SECRET:-${DOKU_SECRET:-}}"
      # Proxy-Header nur aus privaten Netzen auswerten (z. B. Proxy-Container, Proxy auf dem Host)
      TRUST_PROXY: "${TRUST_PROXY:-uniquelocal,loopback}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Zeitzone für nächtliche Sicherung, tägliche Zusammenfassung und Datumsangaben (Container laufen sonst in UTC)
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      # Datenbank, Anhänge, Sicherungen, Serverschlüssel
      - knowstead-data:/app/data
      # Eigene Plugins (optional): lokalen Ordner einhängen
      # - ./plugins:/app/plugins:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  knowstead-data:
